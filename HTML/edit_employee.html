<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Employee - NITDA</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="style/edit_employee.css">
</head>

<body>
    <div class="registration-container">
        <div class="form-header">
            <h1><i class="fas fa-user-edit"></i> Edit Employee</h1>
            <p>NITDA</p>
        </div>

        <form id="employeeForm" class="form-container">
            <!-- Personal Information Section -->
            <div class="form-section">
                <h2>Personal Information</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" name="firstName" value="John" required>
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" name="lastName" value="Doe" required>
                    </div>
                    <div class="form-group">
                        <label>Date of Birth</label>
                        <input type="date" name="dob" value="1985-05-15" required>
                    </div>
                    <div class="form-group">
                        <label>Gender</label>
                        <select name="gender" required>
                            <option value="">Select Gender</option>
                            <option value="Male" selected>Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Contact Information Section -->
            <div class="form-section">
                <h2>Contact Information</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" name="email" value="john.doe@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" name="phone" pattern="[0-9]{11}" value="12345678901" required>
                    </div>
                    <div class="form-group">
                        <label>Residential Address</label>
                        <textarea rows="3" name="address" required>123 Main St, Cityville</textarea>
                    </div>
                    <div class="form-group">
                        <label>Emergency Contact</label>
                        <input type="tel" name="emergencyContact" pattern="[0-9]{11}" value="10987654321" required>
                    </div>
                </div>
            </div>

            <!-- Employment Details Section -->
            <div class="form-section">
                <h2>Employment Details</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Employee ID</label>
                        <input type="text" name="employeeId" value="EMP12345" required>
                    </div>
                    <div class="form-group">
                        <label>Department</label>
                        <select name="department" required>
                            <option value="">Select Department</option>
                            <option value="IT Development" selected>IT Development</option>
                            <option value="Human Resources">Human Resources</option>
                            <option value="Finance">Finance</option>
                            <option value="Operations">Operations</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Position/Title</label>
                        <input type="text" name="position" value="Software Engineer" required>
                    </div>
                    <div class="form-group">
                        <label>Employment Date</label>
                        <input type="date" name="employmentDate" value="2010-01-01" required>
                    </div>
                </div>
            </div>

            <!-- Additional Information -->
            <div class="form-section">
                <h2>Additional Information</h2>
                <div class="form-group">
                    <label>Profile Photo</label>
                    <input type="file" accept="image/*" id="profilePhoto">
                    <img src="profile.jpg" alt="Profile Preview" class="profile-preview" id="profilePreview">
                </div>
                <div class="form-group">
                    <label>Security Clearance Level</label>
                    <select name="clearanceLevel" required>
                        <option value="">Select Clearance Level</option>
                        <option value="Level 1 - Employee" selected>Level 1 - Employee</option>
                        <option value="Level 2 - Admin">Level 2 - Admin</option>
                        <option value="Level 3 - Super admin">Level 3 - Super admin</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fas fa-save"></i> Save Changes
            </button>
        </form>
    </div>

    <!-- Link to the external JavaScript file -->
    <script src="script/edit_employee.js"></script>
</body>

</html>
