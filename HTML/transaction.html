<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History</title>
    <link rel="stylesheet" href="/style/transaction.css">
    <link rel="stylesheet" href="/style/sidebar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="dashboard-container">
        <!-- Sidebar will be dynamically loaded here -->
        <div id="sidebar-container"></div>

        <main class="main-content">
            <div class="container">
                <div class="header-container">
                    <h1>Transaction History</h1>
                    <img src="../images/benovelence_logo.png" alt="Benevolence Logo" class="logo">
                    <!-- Added max-width to Benevolence Logo -->
                </div>
                <div class="filters">
                    <label for="startDate">Start Date:</label>
                    <input type="date" id="startDate">
                    <label for="endDate">End Date:</label>
                    <input type="date" id="endDate">
                    <button id="filterButton">Filter</button>
                </div>
                <div class="transaction-history">
                    <table id="transactionTable">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Description</th>
                                <th>Amount</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Transactions will be populated here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="/script/sidebar.js"></script>
    <script src="/script/transaction.js"></script>
</body>

</html>
