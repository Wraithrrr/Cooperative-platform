<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management - Benevolence Cooperative</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="admin_control.css">
    <link rel="stylesheet" href="sidebar.css">
</head>

<body>
    <div class="dashboard-container">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <div class="header">
                <h1>Employee Management</h1>
                <div class="admin-controls">
                    <button class="btn add-employee-btn"><i class="fas fa-user-plus"></i> Add Employee</button>
                </div>
            </div>

            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search employees">
                <div class="filter-options">
                    <label><input type="checkbox" id="filterByName" checked> Name</label>
                    <label><input type="checkbox" id="filterById"> Employee ID</label>
                    <label><input type="checkbox" id="filterByDepartment"> Department</label>
                </div>
            </div>

            <div class="table-container">
                <table class="employee-table">
                    <thead>
                        <tr>
                            <th>Employee ID</th>
                            <th>Name</th>
                            <th>Department</th>
                            <th>Contribution Amount</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Rows will be populated dynamically -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="admin_control.js"></script>
    <script src="sidebar.js"></script>
</body>

</html>
